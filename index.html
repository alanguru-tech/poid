<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hệ Thống Quản Lý Điểm</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background-color: #0f172a; color: #334155; display: flex; justify-content: center; align-items: center; min-height: 100vh; }
        
        .container { width: 100%; max-width: 900px; background: #ffffff; border-radius: 12px; box-shadow: 0 10px 25px rgba(0,0,0,0.2); overflow: hidden; margin: 20px; }
        
        /* Màn hình Đăng nhập */
        #login-screen { padding: 40px; text-align: center; max-width: 450px; margin: 0 auto; }
        #login-screen h2 { margin-bottom: 8px; color: #1e293b; font-size: 24px; }
        #login-screen p { color: #64748b; font-size: 14px; margin-bottom: 24px; }
        .form-group { text-align: left; margin-bottom: 16px; }
        .form-group label { display: block; font-size: 13px; font-weight: 600; color: #475569; margin-bottom: 6px; }
        .form-control { width: 100%; padding: 12px; border: 1px solid #cbd5e1; border-radius: 8px; font-size: 14px; outline: none; transition: border-color 0.2s; }
        .form-control:focus { border-color: #6366f1; }
        .btn { width: 100%; padding: 12px; background: #6366f1; color: white; border: none; border-radius: 8px; font-size: 15px; font-weight: 600; cursor: pointer; transition: background 0.2s; }
        .btn:hover { background: #4f46e5; }

        /* Màn hình Dashboard */
        #app-screen { display: none; padding: 30px; }
        .header { display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #e2e8f0; padding-bottom: 15px; margin-bottom: 20px; }
        .header h1 { font-size: 20px; color: #1e293b; }
        .nav-tabs { display: flex; gap: 10px; margin-bottom: 20px; border-bottom: 2px solid #f1f5f9; padding-bottom: 10px; }
        .tab-btn { background: none; border: none; font-size: 15px; font-weight: 600; color: #64748b; cursor: pointer; padding: 8px 16px; border-radius: 6px; transition: all 0.2s; }
        .tab-btn.active { background: #e0e7ff; color: #4f46e5; }
        
        .tab-content { display: none; }
        .tab-content.active { display: block; }

        /* Form thao tác điểm */
        .card { background: #f8fafc; border: 1px solid #e2e8f0; border-radius: 8px; padding: 20px; margin-bottom: 20px; }
        .card h3 { font-size: 16px; color: #334155; margin-bottom: 15px; }
        .row { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; margin-bottom: 15px; }
        @media(max-width: 600px) { .row { grid-template-columns: 1fr; } }
        
        .btn-group { display: flex; gap: 10px; }
        .btn-success { background: #10b981; }
        .btn-success:hover { background: #059669; }
        .btn-danger { background: #ef4444; }
        .btn-danger:hover { background: #dc2626; }
        .btn-secondary { background: #64748b; width: auto; padding: 8px 16px; font-size: 13px; }

        /* Lịch sử */
        .history-item { background: white; border: 1px solid #e2e8f0; border-left: 4px solid #6366f1; border-radius: 6px; padding: 12px 15px; margin-bottom: 10px; display: flex; justify-content: space-between; align-items: center; }
        .history-item.plus { border-left-color: #10b981; }
        .history-item.minus { border-left-color: #ef4444; }
        .history-info p { font-size: 14px; color: #1e293b; margin-bottom: 3px; }
        .history-info span { font-size: 12px; color: #64748b; }
        .history-time { font-size: 12px; color: #94a3b8; text-align: right; }
    </style>
</head>
<body>

    <div class="container">
        <!-- ĐĂNG NHẬP -->
        <div id="login-screen">
            <h2>Đăng Nhập Hệ Thống</h2>
            <p>Sử dụng tài khoản được cấp để truy cập</p>
            <div class="form-group">
                <label>TÊN ĐĂNG NHẬP:</label>
                <input type="text" id="username" class="form-control" placeholder="Nhập tên đăng nhập...">
            </div>
            <div class="form-group">
                <label>MẬT KHẨU:</label>
                <input type="password" id="password" class="form-control" placeholder="Nhập mật khẩu...">
            </div>
            <button class="btn" onclick="handleLogin()">Đăng Nhập</button>
        </div>

        <!-- MÀN HÌNH CHÍNH -->
        <div id="app-screen">
            <div class="header">
                <h1 id="welcome-text">Xin chào, Quản Trị Viên</h1>
                <button class="btn btn-secondary" onclick="handleLogout()">Đăng Xuất</button>
            </div>

            <div class="nav-tabs">
                <button class="tab-btn active" onclick="switchTab('manage-tab', this)">Quản Lý Điểm</button>
                <button class="tab-btn" onclick="switchTab('history-tab', this)">Lịch Sử Hoạt Động</button>
            </div>

            <!-- Tab 1: Quản lý điểm (Cộng / Trừ) -->
            <div id="manage-tab" class="tab-content active">
                <div class="card">
                    <h3>Thực Hiện Cộng / Trừ Điểm Học Sinh</h3>
                    <div class="form-group">
                        <label>Họ và tên học sinh:</label>
                        <input type="text" id="student-name" class="form-control" placeholder="Ví dụ: Nguyễn Văn A">
                    </div>
                    <div class="row">
                        <div class="form-group" style="margin-bottom:0;">
                            <label>Số điểm:</label>
                            <input type="number" id="point-value" class="form-control" placeholder="Ví dụ: 10" min="1">
                        </div>
                        <div class="form-group" style="margin-bottom:0;">
                            <label>Lý do:</label>
                            <input type="text" id="point-reason" class="form-control" placeholder="Lý do cộng/trừ...">
                        </div>
                    </div>
                    <br>
                    <div class="btn-group">
                        <button class="btn btn-success" onclick="modifyPoint('plus')">Cộng Điểm</button>
                        <button class="btn btn-danger" onclick="modifyPoint('minus')">Trừ Điểm</button>
                    </div>
                </div>
            </div>

            <!-- Tab 2: Lịch sử riêng (Đăng nhập & Cộng trừ điểm) -->
            <div id="history-tab" class="tab-content">
                <div class="card" style="background:white; border:none; padding:0;">
                    <h3 style="margin-bottom: 10px;">📋 Nhật Ký Cộng / Trừ Điểm</h3>
                    <div id="point-history-list"><p style="color:#64748b; font-size:14px;">Chưa có lịch sử cộng trừ điểm nào.</p></div>
                    
                    <h3 style="margin-top: 30px; margin-bottom: 10px;">🔒 Nhật Ký Đăng Nhập</h3>
                    <div id="login-history-list"><p style="color:#64748b; font-size:14px;">Chưa có lịch sử đăng nhập.</p></div>
                </div>
            </div>
        </div>
    </div>

    <script>
        // Kiểm tra trạng thái đăng nhập khi tải trang
        window.onload = function() {
            const currentUser = localStorage.getItem('currentUser');
            if (currentUser) {
                document.getElementById('login-screen').style.display = 'none';
                document.getElementById('app-screen').style.display = 'block';
                document.getElementById('welcome-text').innerText = `Xin chào, ${currentUser}`;
                renderHistory();
            }
        }

        function handleLogin() {
            const user = document.getElementById('username').value.trim();
            const pass = document.getElementById('password').value.trim();

            if (!user || !pass) {
                alert('Vui lòng nhập đầy đủ tên đăng nhập và mật khẩu!');
                return;
            }

            // Lưu lịch sử đăng nhập
            saveLoginHistory(user);

            localStorage.setItem('currentUser', user);
            document.getElementById('login-screen').style.display = 'none';
            document.getElementById('app-screen').style.display = 'block';
            document.getElementById('welcome-text').innerText = `Xin chào, ${user}`;
            renderHistory();
        }

        function handleLogout() {
            localStorage.removeItem('currentUser');
            location.reload();
        }

        function switchTab(tabId, btnElement) {
            document.querySelectorAll('.tab-content').forEach(el => el.classList.remove('active'));
            document.querySelectorAll('.tab-btn').forEach(el => el.classList.remove('active'));
            
            document.getElementById(tabId).classList.add('active');
            btnElement.classList.add('active');
        }

        function saveLoginHistory(username) {
            let loginHistories = JSON.parse(localStorage.getItem('loginHistories')) || [];
            const timeStr = new Date().toLocaleString('vi-VN');
            loginHistories.unshift({ username, time: timeStr });
            localStorage.setItem('loginHistories', JSON.stringify(loginHistories));
        }

        function modifyPoint(type) {
            const studentName = document.getElementById('student-name').value.trim();
            const point = document.getElementById('point-value').value;
            const reason = document.getElementById('point-reason').value.trim();
            const currentUser = localStorage.getItem('currentUser') || 'Quản trị viên';

            if (!studentName || !point || !reason) {
                alert('Vui lòng điền đầy đủ thông tin học sinh, số điểm và lý do!');
                return;
            }

            let pointHistories = JSON.parse(localStorage.getItem('pointHistories')) || [];
            const timeStr = new Date().toLocaleString('vi-VN');

            pointHistories.unshift({
                type: type, // 'plus' hoặc 'minus'
                student: studentName,
                point: point,
                reason: reason,
                author: currentUser,
                time: timeStr
            });

            localStorage.setItem('pointHistories', JSON.stringify(pointHistories));

            // Reset form
            document.getElementById('student-name').value = '';
            document.getElementById('point-value').value = '';
            document.getElementById('point-reason').value = '';

            alert(type === 'plus' ? 'Đã cộng điểm thành công!' : 'Đã trừ điểm thành công!');
            renderHistory();
        }

        function renderHistory() {
            // Hiển thị lịch sử cộng trừ điểm
            const pointHistories = JSON.parse(localStorage.getItem('pointHistories')) || [];
            const pointContainer = document.getElementById('point-history-list');
            
            if (pointHistories.length === 0) {
                pointContainer.innerHTML = '<p style="color:#64748b; font-size:14px;">Chưa có lịch sử cộng trừ điểm nào.</p>';
            } else {
                let html = '';
                pointHistories.forEach(item => {
                    const isPlus = item.type === 'plus';
                    html += `
                        <div class="history-item ${isPlus ? 'plus' : 'minus'}">
                            <div class="history-info">
                                <p><strong>${isPlus ? 'Cộng' : 'Trừ'}:</strong> <span style="color: ${isPlus ? '#10b981' : '#ef4444'}; font-weight: bold;">${isPlus ? '+' : '-'}${item.point}đ</span> cho học sinh: <strong>${item.student}</strong></p>
                                <p><span>Lý do: ${item.reason}</span> | <span style="color: #6366f1;">Bởi: ${item.author}</span></p>
                            </div>
                            <div class="history-time">${item.time}</div>
                        </div>
                    `;
                });
                pointContainer.innerHTML = html;
            }

            // Hiển thị lịch sử đăng nhập
            const loginHistories = JSON.parse(localStorage.getItem('loginHistories')) || [];
            const loginContainer = document.getElementById('login-history-list');

            if (loginHistories.length === 0) {
                loginContainer.innerHTML = '<p style="color:#64748b; font-size:14px;">Chưa có lịch sử đăng nhập.</p>';
            } else {
                let loginHtml = '';
                loginHistories.forEach(item => {
                    loginHtml += `
                        <div class="history-item">
                            <div class="history-info">
                                <p>Tài khoản <strong>${item.username}</strong> đã đăng nhập hệ thống.</p>
                            </div>
                            <div class="history-time">${item.time}</div>
                        </div>
                    `;
                });
                loginContainer.innerHTML = loginHtml;
            }
        }
    </script>
</body>
</html>
